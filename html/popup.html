<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <main class="popup-card">
    <header class="popup-header">
      <img src="../imgs/logo.png" alt="" class="logo">
      <div class="popup-heading"><p class="eyebrow">asbplayer</p><h1 data-i18n="title">Automatic subtitles</h1></div>
      <label class="language-picker" for="language"><span data-i18n="languageLabel">Language</span>
        <select id="language" name="language" aria-label="Language">
          <option value="en">English</option>
          <option value="pt-BR">Português</option>
        </select>
      </label>
    </header>
    <form id="apiKeyForm">
      <label for="apiKey" data-i18n="apiKeyLabel">Jimaku API key</label>
      <div class="input-row">
        <input type="password" id="apiKey" name="apiKey" data-i18n-placeholder="apiKeyPlaceholder" placeholder="Paste your key here" autocomplete="off" required>
        <button class="set-btn" type="submit" data-i18n="save">Save</button>
      </div>
      <p class="key-info"><span data-i18n="keyInfo">Set up your key at</span> <a href="https://jimaku.cc/login" target="_blank">jimaku.cc</a>.</p>
    </form>
    <section class="settings-container" aria-labelledby="settings-title">
      <h2 id="settings-title" data-i18n="preferences">Preferences</h2>
      <label class="setting-row" for="autoDelete">
        <span><strong data-i18n="autoDeleteTitle">Delete when changing episodes or closing the tab</strong><small data-i18n="autoDeleteDescription">Removes the downloaded subtitle for this tab from your computer.</small></span>
        <input type="checkbox" name="autoDelete" id="autoDelete">
      </label>
      <label class="setting-row" for="asbplayerAutoLoad">
        <span><strong data-i18n="asbplayerAutoLoadTitle">Add to asbplayer</strong><small data-i18n="asbplayerAutoLoadDescription">Automatically sends the formatted subtitle to asbplayer.</small></span>
        <input type="checkbox" name="asbplayerAutoLoad" id="asbplayerAutoLoad">
      </label>
      <label class="setting-row" for="formatSubtitles">
        <span><strong data-i18n="formatSubtitlesTitle">Format subtitles</strong><small data-i18n="formatSubtitlesDescription">Removes names, furigana, and line breaks from text subtitles.</small></span>
        <input type="checkbox" name="formatSubtitles" id="formatSubtitles">
      </label>
      <div id="formattingOptions" class="formatting-options">
        <label class="format-option select-all" for="selectAllFormatting"><span data-i18n="selectAllFormatting">Select all formatting options</span><input type="checkbox" id="selectAllFormatting"></label>
        <label class="format-option" for="removeSpeakerNames"><span data-i18n="removeSpeakerNames">Remove character names</span><input type="checkbox" id="removeSpeakerNames"></label>
        <label class="format-option" for="removeFurigana"><span data-i18n="removeFurigana">Remove furigana in parentheses</span><input type="checkbox" id="removeFurigana"></label>
        <label class="format-option" for="removeAssTags"><span data-i18n="removeAssTags">Remove ASS formatting tags</span><input type="checkbox" id="removeAssTags"></label>
        <label class="format-option" for="removeDecorativeMarkers"><span data-i18n="removeDecorativeMarkers">Remove decorative markers ＜ ＞ ➨ ➡</span><input type="checkbox" id="removeDecorativeMarkers"></label>
        <label class="format-option" for="joinSubtitleLines"><span data-i18n="joinSubtitleLines">Join lines from the same subtitle</span><input type="checkbox" id="joinSubtitleLines"></label>
      </div>
    </section>
    <section class="diagnostics" aria-labelledby="diagnostics-title">
      <h2 id="diagnostics-title" data-i18n="diagnostics">Diagnostics</h2>
      <button type="button" id="copyAsbLog" class="copy-log-btn" data-i18n="copyLog">Copy asbplayer log</button>
      <p id="asbLogStatus" class="log-status"></p>
    </section>
    <footer class="popup-footer">asb auto subs <span id="extensionVersion"></span></footer>
  </main>
  <script src="../dist/popup.js"></script>
</body>
</html>
